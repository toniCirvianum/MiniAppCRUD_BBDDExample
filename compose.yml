services:
  php:
    build: .
    volumes:
      - .:/var/www/html
    ports:
      - "${APP_PORT:-8089}:80"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # Comprova periòdicament que MySQL accepta connexions amb l'usuari de
    # l'aplicació i pot executar SELECT 1 a la base de dades configurada.
    # Amb depends_on i service_healthy, PHP i phpMyAdmin esperen que aquesta
    # comprovació passi abans d'arrencar: tenir el contenidor en marxa no
    # significa que MySQL ja estigui preparat per rebre consultes.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -D "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "${PHPMYADMIN_PORT:-8090}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
    name: db_miniApp
